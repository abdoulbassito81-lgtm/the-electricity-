    },
    contest_amount: function (a) {
      var p = me(), r = req(a.rid);

    },

      if (p.id === r.client_id) return { data: [pr(r.partner_id)], error: null };
      if (p.id === r.partner_id) return { data: [pr(r.client_id)], error: null };
      if (p.role === "admin") return { data: [pr(r.client_id), pr(r.partner_id)], error: null };
      return { data: [], error: null };
    },

    },
    admin_confirm_commission: function (a) {
      var p = me(), r = req(a.rid); if (!p || p.role !== "admin") return fail("Réservé à l'administrateur.");
      if (!r || ["due", "declaree_payee"].indexOf(r.commission_status) < 0) return fail("Action impossible.");

    },

      if (!(a.amt > 0)) return fail("Montant invalide.");

    }

  var client = {

  };
  window.supabase = { createClient: function () { return client; } };

function brancherLogin(){
  var f = $("#f-login"); if (!f) return;
  f.addEventListener("submit", function(e){
    e.preventDefault(); if (!sb) return;
    var tel = normTel($("#l-tel").value), err = $("#l-err"), b = $("button", f);
    if (!telValide(tel)) { err.textContent = "Numéro invalide. Entrez 8 chiffres, par exemple 70 12 34 56."; err.hidden = false; return; }
    b.disabled = true; err.hidden = true;
    sb.auth.signInWithPassword({ email: emailFictif(tel), password: $("#l-mdp").value }).then(function(r){
      if (r.error) throw r.error;
      toast("Connexion réussie."); location.hash = "#espace";
    }).catch(function(x){ err.textContent = msgErreur(x); err.hidden = false; }).then(function(){ b.disabled = false; });
  });
}
function brancherInscription(){
  var f = $("#f-inscr"); if (!f) return;
  f.addEventListener("submit", function(e){
    e.preventDefault(); if (!sb) return;
    var tel = normTel($("#i-tel").value), err = $("#i-err"), b = $("button[type=submit]", f), role = f.getAttribute("data-role");
    var services = $$("input[name=svc]:checked", f).map(function(x){ return x.value; });
    if (!telValide(tel)) { err.textContent = "Numéro invalide. Entrez 8 chiffres, par exemple 70 12 34 56."; err.hidden = false; return; }
    if (role === "partner" && !services.length) { err.textContent = "Choisissez au moins une spécialité."; err.hidden = false; return; }
    b.disabled = true; err.hidden = true;
    sb.auth.signUp({ email: emailFictif(tel), password: $("#i-mdp").value,
      options: { data: { full_name: $("#i-nom").value.trim(), phone: tel, quartier: $("#i-quartier").value.trim(), role: role, services: services } } })
    .then(function(r){
      if (r.error) throw r.error;
      if (!r.data.session) { err.textContent = "Compte créé, mais la connexion automatique est désactivée. Connectez-vous avec votre numéro."; err.hidden = false; return; }
      toast(role === "partner" ? "Candidature envoyée. Elle sera validée par " + SITE.nom + "." : "Compte créé. Bienvenue !");
      location.hash = "#espace";
    }).catch(function(x){ err.textContent = msgErreur(x); err.hidden = false; }).then(function(){ b.disabled = false; });
  });
}

   '<div class="boite"><h2 style="margin-bottom:12px">Nouvelle demande</h2><form class="f" id="f-req">' +

   '<div class="erreur" id="r-err" hidden></div>' +
   '<button class="btn btn-or" type="submit">Envoyer ma demande</button></form></div>';

   '<p class="sous">Bonjour ' + esc(S.profile.full_name) + '. ' + esc(SITE.nom) + ' envoie votre demande aux professionnels de la bonne spécialité.</p>' + form +
   '<div class="rangee" style="justify-content:space-between;align-items:center"><h2>Mes demandes</h2><button class="btn btn-clair btn-sm" data-act="rafraichir" type="button">Actualiser</button></div>' +
   '<div id="liste" class="liste-cartes"><div class="boite"><p>Chargement…</p></div></div>';
  $("#f-req").addEventListener("submit", function(e){
    e.preventDefault();
    var b = $("button[type=submit]", e.target), err = $("#r-err"); b.disabled = true; err.hidden = true;

        e.target.reset(); $("#r-quartier").value = S.profile.quartier || "";
        toast("Demande envoyée. Un partenaire va vous répondre."); chargerClient();
      }).catch(function(x){ err.textContent = msgErreur(x); err.hidden = false; }).then(function(){ b.disabled = false; });
  });

function chargerClient(){
  sb.from("requests").select("*").eq("client_id", S.user.id).order("created_at", { ascending: false }).limit(50).then(function(r){
    var zone = $("#liste"); if (!zone) return;
    if (r.error) { zone.innerHTML = '<div class="erreur">Impossible de charger vos demandes.</div>'; return; }
    if (!r.data.length) { zone.innerHTML = '<div class="vide"><p>Aucune demande pour le moment. Envoyez la première avec le formulaire ci-dessus.</p></div>'; return; }
    zone.innerHTML = r.data.map(carteClient).join("");
  });
}
function carteClient(x){
  var actions = "";
  if (x.status === "nouvelle") actions = '<div class="rangee"><button class="btn btn-rouge btn-sm" data-act="annuler" data-id="' + x.id + '" type="button">Annuler la demande</button></div>';
  if (x.status === "acceptee") actions = carteContact(x.id) + '<div class="rangee"><button class="btn btn-rouge btn-sm" data-act="annuler" data-id="' + x.id + '" type="button">Annuler la demande</button></div>';
  if (x.status === "montant_declare") actions =
    '<div class="note">Le partenaire déclare un montant de <b>' + fcfa(x.amount) + '</b>. Est-ce le montant convenu avec lui ?</div>' +
    '<div class="rangee"><button class="btn btn-or btn-sm" data-act="confirmer" data-id="' + x.id + '" type="button">Oui, je confirme</button>' +
    '<button class="btn btn-rouge btn-sm" data-act="contester" data-id="' + x.id + '" type="button">Non, je conteste</button></div>' + carteContact(x.id);
  if (x.status === "litige") actions = '<div class="note">Vous avez contesté le montant. ' + esc(SITE.nom) + ' va vous contacter.</div>';
  if (x.status === "confirmee") actions = '<div class="aide">Chantier terminé. Montant confirmé : ' + fcfa(x.amount) + '. Merci de votre confiance.</div>';
  return '<div class="boite demande"><div class="tete"><h3>' + esc(svcNom(x.service)) + (x.urgent ? ' · Urgent' : '') + '</h3>' + badge(x.status, STATUTS[x.status] || x.status) + '</div>' +

function chargerPartenaire(silencieux){
  sb.from("requests").select("*").order("created_at", { ascending: false }).limit(100).then(function(r){
    if (r.error) { if (!silencieux) toast("Impossible de charger les demandes.", true); return; }
    var uid = S.user.id;
    var ouvertes = r.data.filter(function(x){ return x.status === "nouvelle"; });
    var mes = r.data.filter(function(x){ return x.partner_id === uid; });
    var dues = mes.filter(function(x){ return x.commission_status === "due"; });
    var aVerifier = mes.filter(function(x){ return x.commission_status === "declaree_payee"; });
    var totalDu = dues.reduce(function(s, x){ return s + (x.commission || 0); }, 0);
    var res = $("#p-resume"); if (!res) return;
    var bloque = dues.length > 0;
    res.innerHTML =
      (bloque ? '<div class="erreur"><b>Commission à payer : ' + fcfa(totalDu) + '.</b> Tant qu\'elle n\'est pas payée, vous ne pouvez pas accepter de nouvelle demande.<br>' + esc(SITE.paiement) + '</div>' : '') +
      '<div class="resume"><div class="boite"><span class="aide">Demandes disponibles</span><div class="gros">' + ouvertes.length + '</div></div>' +
      '<div class="boite"><span class="aide">Chantiers en cours</span><div class="gros">' + mes.filter(function(x){ return x.status === "acceptee" || x.status === "montant_declare"; }).length + '</div></div>' +
      '<div class="boite"><span class="aide">Commission à payer</span><div class="gros">' + fcfa(totalDu) + '</div></div>' +
      '<div class="boite"><span class="aide">Paiement à vérifier</span><div class="gros">' + aVerifier.length + '</div></div></div>';
    var zo = $("#p-ouvertes");
    zo.innerHTML = ouvertes.length ? ouvertes.map(function(x){
      return '<div class="boite demande"><div class="tete"><h3>' + esc(svcNom(x.service)) + (x.urgent ? ' · Urgent' : '') + '</h3><span class="meta">' + dateCourte(x.created_at) + '</span></div>' +
        '<div class="meta">' + esc(x.quartier) + '</div><div class="desc">' + esc(x.description) + '</div>' +
        '<div class="rangee"><button class="btn btn-or btn-sm" data-act="accepter" data-id="' + x.id + '" type="button"' + (bloque ? ' disabled' : '') + '>Accepter cette demande</button></div></div>';
    }).join("") : '<div class="vide"><p>Aucune demande pour le moment dans vos spécialités. Cette page s\'actualise toute seule.</p></div>';
    var zm = $("#p-mes");
    zm.innerHTML = mes.length ? mes.map(carteMesChantiers).join("") : '<div class="vide"><p>Vos chantiers apparaîtront ici après avoir accepté une demande.</p></div>';
  });

    actions = '<div class="rangee" style="align-items:center"><span class="montant">' + fcfa(x.amount) + '</span><span class="aide">Commission : ' + fcfa(x.commission) + '</span>' + badge(x.commission_status, STATUTS_COMM[x.commission_status] || "") + '</div>';

function chargerAdmin(){
  Promise.all([
    sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(500),
    sb.from("requests").select("*").order("created_at", { ascending: false }).limit(500)
  ]).then(function(r){
    if (r[0].error || r[1].error) { var z = $("#a-corps"); if (z) z.innerHTML = '<div class="erreur">Impossible de charger les données.</div>'; return; }
    var profils = r[0].data, reqs = r[1].data, nom = {}, tel = {};
    profils.forEach(function(p){ nom[p.id] = p.full_name; tel[p.id] = p.phone; });
    var pros = profils.filter(function(p){ return p.role === "partner"; });
    var dues = reqs.filter(function(x){ return x.commission_status === "due" || x.commission_status === "declaree_payee"; });
    var litiges = reqs.filter(function(x){ return x.status === "litige"; });
    var totalDu = dues.reduce(function(s, x){ return s + (x.commission || 0); }, 0);
    var totalRecu = reqs.filter(function(x){ return x.commission_status === "payee"; }).reduce(function(s, x){ return s + (x.commission || 0); }, 0);
    var attente = pros.filter(function(p){ return p.status === "en_attente"; }).length;
    $("#a-resume").innerHTML = '<div class="resume">' +
      '<div class="boite"><span class="aide">Partenaires à valider</span><div class="gros">' + attente + '</div></div>' +
      '<div class="boite"><span class="aide">Commissions à recevoir</span><div class="gros">' + fcfa(totalDu) + '</div></div>' +
      '<div class="boite"><span class="aide">Commissions reçues</span><div class="gros">' + fcfa(totalRecu) + '</div></div>' +
      '<div class="boite"><span class="aide">Litiges</span><div class="gros">' + litiges.length + '</div></div></div>';
    window.__adm = { profils: profils, reqs: reqs, nom: nom, tel: tel };
    dessinerAdmin();
  });
}
function dessinerAdmin(){
  var A = window.__adm, z = $("#a-corps"); if (!A || !z) return;
  $$(".onglets button[data-act=onglet]").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-id") === adminOnglet)); });

        '<div class="meta">' + esc(telAffiche(p.phone)) + ' · ' + esc(p.quartier || "") + '</div><div class="meta">' + esc((p.services || []).map(svcNom).join(", ")) + '</div>' +
        '<div class="rangee">' + lienAppeler(p.phone) + b + '</div></div>';
    }).join("") + '</div>' : '<div class="vide"><p>Aucun partenaire inscrit pour le moment.</p></div>';
  }
  if (adminOnglet === "comm") {
    var dues = A.reqs.filter(function(x){ return x.commission_status === "due" || x.commission_status === "declaree_payee"; });
    html = dues.length ? '<div class="liste-cartes">' + dues.map(function(x){
      return '<div class="boite demande"><div class="tete"><h3>' + esc(A.nom[x.partner_id] || "Partenaire") + '</h3>' + badge(x.commission_status, STATUTS_COMM[x.commission_status]) + '</div>' +
        '<div class="meta">' + esc(svcNom(x.service)) + ' · chantier ' + fcfa(x.amount) + '</div><div class="montant">Commission : ' + fcfa(x.commission) + '</div>' +
        '<div class="rangee">' + (A.tel[x.partner_id] ? lienAppeler(A.tel[x.partner_id]) : '') +
        '<button class="btn btn-or btn-sm" data-act="encaisse" data-id="' + x.id + '" type="button">Paiement reçu</button></div></div>';
    }).join("") + '</div>' : '<div class="vide"><p>Aucune commission en attente.</p></div>';
  }
  if (adminOnglet === "litiges") {
    var lit = A.reqs.filter(function(x){ return x.status === "litige"; });
    html = lit.length ? '<div class="liste-cartes">' + lit.map(function(x){
      return '<div class="boite demande"><div class="tete"><h3>' + esc(svcNom(x.service)) + '</h3>' + badge("litige", "Montant contesté") + '</div>' +
        '<div class="meta">Client : ' + esc(A.nom[x.client_id] || "") + ' · Partenaire : ' + esc(A.nom[x.partner_id] || "") + '</div>' +
        '<div class="meta">Montant déclaré par le partenaire : ' + fcfa(x.amount) + '</div>' +
        '<div class="rangee">' + (A.tel[x.client_id] ? lienAppeler(A.tel[x.client_id]) : '') + '</div>' +
        '<form class="f" data-form="litige" data-id="' + x.id + '"><div class="inline"><label for="lt-' + x.id + '">Montant retenu (F CFA)<input id="lt-' + x.id + '" inputmode="numeric" required value="' + esc(x.amount) + '"></label>' +
        '<button class="btn btn-or btn-sm" type="submit">Valider ce montant</button></div></form></div>';
    }).join("") + '</div>' : '<div class="vide"><p>Aucun litige.</p></div>';
  }
  if (adminOnglet === "req") {

      A.reqs.map(function(x){
        return '<tr><td>' + dateCourte(x.created_at) + '</td><td>' + esc(svcNom(x.service)) + '</td><td>' + esc(A.nom[x.client_id] || "") + '</td><td>' + esc(A.nom[x.partner_id] || "–") + '</td><td>' + esc(STATUTS[x.status]) + '</td><td class="num">' + (x.amount ? fcfa(x.amount) : "–") + '</td><td class="num">' + (x.commission != null ? fcfa(x.commission) : "–") + '</td></tr>';
      }).join("") + '</tbody></table></div>' : '<div class="vide"><p>Aucune demande.</p></div>';
  }
  if (adminOnglet === "clients") {
    var cl = A.profils.filter(function(p){ return p.role === "client"; });
    html = cl.length ? '<div class="defil"><table><thead><tr><th>Nom</th><th>Téléphone</th><th>Quartier</th><th>Inscrit</th></tr></thead><tbody>' +
      cl.map(function(p){ return '<tr><td>' + esc(p.full_name) + '</td><td>' + esc(telAffiche(p.phone)) + '</td><td>' + esc(p.quartier || "") + '</td><td>' + dateCourte(p.created_at) + '</td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="vide"><p>Aucun client inscrit.</p></div>';
  }

}

/* ============ ACTIONS (clics) ============ */
function actionApres(){
  var r = S.profile && S.profile.role;
  if (r === "admin") chargerAdmin(); else if (r === "partner") chargerPartenaire(true); else chargerClient();
}
function faire(btn, promesse, ok){
  btn.disabled = true;
  promesse.then(function(){ if (ok) toast(ok); actionApres(); }).catch(function(e){ toast(msgErreur(e), true); btn.disabled = false; });
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("[data-act]"); if (!b || !sb) return;
  var act = b.getAttribute("data-act"), id = b.getAttribute("data-id");
  if (act === "rafraichir") { actionApres(); return; }
  if (act === "onglet") { adminOnglet = id; dessinerAdmin(); return; }
  if (act === "contact") {
    b.disabled = true;
    sb.rpc("request_contact", { rid: id }).then(function(r){
      var box = b.parentNode;
      if (r.error || !r.data || !r.data.length) { box.innerHTML = '<span class="aide">Coordonnées non disponibles.</span>'; return; }
      box.innerHTML = r.data.map(function(c){
        return '<div><b>' + esc(c.full_name) + '</b> · ' + esc(telAffiche(c.phone)) + '</div><div class="rangee">' + lienAppeler(c.phone) + '</div>';
      }).join("");
    });
    return;
  }
  if (act === "accepter") return faire(b, rpc("accept_request", { rid: id }), "Demande acceptée. Contactez le client.");
  if (act === "confirmer") return faire(b, rpc("confirm_amount", { rid: id }), "Montant confirmé. Merci !");
  if (act === "contester") return confirmeDouble(b, "Confirmer la contestation ?", function(){ faire(b, rpc("contest_amount", { rid: id }), "Contestation envoyée."); });
  if (act === "annuler") return confirmeDouble(b, "Confirmer l'annulation ?", function(){ faire(b, rpc("cancel_request", { rid: id }), "Demande annulée."); });
  if (act === "paye") return confirmeDouble(b, "Confirmer : j'ai payé", function(){ faire(b, rpc("report_commission_paid", { rid: id }), "Merci. Le paiement sera vérifié."); });
  if (act === "encaisse") return confirmeDouble(b, "Confirmer la réception", function(){ faire(b, rpc("admin_confirm_commission", { rid: id }), "Commission marquée comme payée."); });
  if (act === "statut") {
    var st = b.getAttribute("data-st");
    var go = function(){ faire(b, rpc("admin_set_status", { uid: id, st: st }), st === "actif" ? "Partenaire activé." : "Partenaire bloqué."); };
    if (st === "bloque") return confirmeDouble(b, "Confirmer le blocage", go); go();
  }
});
document.addEventListener("submit", function(e){
  var f = e.target; if (!sb) return;
  var type = f.getAttribute && f.getAttribute("data-form"); if (!type) return;
  e.preventDefault();
  var id = f.getAttribute("data-id"), inp = $("input", f), m = parseInt(chiffres(inp.value), 10) || 0, btn = $("button[type=submit]", f);
  if (m <= 0) { toast("Entrez un montant valide.", true); return; }
  if (type === "montant") faire(btn, rpc("declare_amount", { rid: id, amt: m }), "Montant déclaré. En attente du client.");
  if (type === "litige") faire(btn, rpc("admin_resolve_dispute", { rid: id, amt: m }), "Litige réglé.");
});
document.addEventListener("input", function(e){
  var f = e.target.closest && e.target.closest("form[data-form=montant]"); if (!f) return;
  var m = parseInt(chiffres(e.target.value), 10) || 0, a = $("[data-apercu]", f); if (!a) return;
  a.textContent = m ? "Commission estimée à " + tauxPour(m) + " % : " + fcfa(commission(m)) : "La commission vous sera indiquée après confirmation du client.";
});

/* ============ ROUTEUR ============ */
function route(){
  var h = (location.hash || "#accueil").replace("#", "") || "accueil";
  clearInterval(window.__poll);
  var html, v = $("#vue"); if (!v) return;
  if (!S.pret) { v.innerHTML = '<div class="wrap page"><p>Chargement…</p></div>'; return; }
  if (h.indexOf("service-") === 0) html = vueService(h.slice(8));
  else if (h === "devis") html = vueDevis();
  else if (h === "boutique") html = vueBoutique();
  else if (h === "realisations") html = vueRealisations();
  else if (h === "commission") html = vueCommission();
  else if (h === "politique") html = vuePolitique();
  else if (h === "connexion") html = vueConnexion();
  else if (h === "inscription") html = vueInscription(false);
  else if (h === "inscription-partenaire") html = vueInscription(true);
  else if (h === "espace") html = vueEspace();
  else html = vueAccueil();
  if (html === "") return;
  v.innerHTML = html;
  $$("nav.menu a").forEach(function(a){ if (a.getAttribute("href") === "#" + h) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  $("nav.menu").classList.remove("open"); $(".burger").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  if (h === "devis") brancherDevis();
  if (h === "commission") brancherCalc();
  if (h === "connexion") brancherLogin();
  if (h === "inscription" || h === "inscription-partenaire") brancherInscription();
  if (h === "espace") chargerEspace();
}
function brancherDevis(){
  $("#f-devis").addEventListener("submit", function(e){
    e.preventDefault();
    var p = $("#d-presta"), lib = p.options[p.selectedIndex].text;
    var msg = "Bonjour Electrobass service, je vous contacte depuis votre site Web pour une demande de devis.\n\nNom : " + $("#d-nom").value.trim() +
      "\nTéléphone : " + $("#d-tel").value.trim() + "\nVille et quartier : " + $("#d-ville").value.trim() + "\nPrestation : " + lib + "\nDescription : " + $("#d-desc").value.trim();
    window.open(waLien(msg), "_blank", "noopener") || (location.href = waLien(msg));
  });
}
function brancherCalc(){
  $("#c-montant").addEventListener("input", function(){
    var m = parseInt(chiffres(this.value), 10) || 0;
    if (!m) { $("#c-taux").textContent = "Entrez un montant."; $("#c-res").textContent = "–"; return; }
    $("#c-taux").textContent = "Chantier de " + fcfa(m) + " : taux de " + tauxPour(m) + " %";
    $("#c-res").textContent = "Commission : " + fcfa(commission(m));

}

function monterAssistant(){
